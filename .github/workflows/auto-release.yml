name: Automatic release

# Every third night (Amsterdam time) this checks whether anything that
# matters changed since the last release. If so it picks the version from how
# big the changes were, writes short release notes, and hands over to
# release.yml to build and publish. If nothing changed it does nothing.
#
# How the size is decided, and what counts, is documented at the top of
# scripts/release-plan.mjs. Commits say how big they are with a "Change:"
# and "Note:" line (see CLAUDE.md). The release notes themselves are the few
# player headlines kept in RELEASE-NOTES-NEXT.md; the Note: lines are only the
# fallback when that file is empty. After a successful publish, the reset-notes
# job below empties the file again and commits that to main.
#
# It wakes up at 01:10 UTC (02:10 or 03:10 in Amsterdam). GitHub often starts
# scheduled jobs hours late, so the time of day isn't checked: the first run
# after the third night does the release.
#
# Run it by hand from the Actions tab to preview: "Run workflow" with
# "Actually publish" off prints the plan without releasing anything.

on:
  schedule:
    - cron: "10 1 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish (off = just show the plan, ignoring the 3-night wait)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      notes: ${{ steps.plan.outputs.notes }}
      notes_file_hash: ${{ steps.hash.outputs.hash }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags, to diff against the last release

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          # Pre-releases and drafts (usually test cuts) never count as the previous
          # release. No "|| true" here: if GitHub can't be asked, stop rather
          # than quietly counting test cuts.
          export RELEASE_SKIP_TAGS=$(gh release list --limit 200 --json tagName,isPrerelease,isDraft \
            -q '[.[] | select(.isPrerelease or .isDraft) | .tagName] | join(",")')
          echo "Skipping pre-releases/drafts: ${RELEASE_SKIP_TAGS:-none}"
          # The last release's real publish date (the tag's commit date can be older).
          LAST_TAG=$(node scripts/release-plan.mjs --print-last-tag)
          LAST_DATE=$(gh release view "$LAST_TAG" --json publishedAt -q .publishedAt 2>/dev/null || true)
          ARGS=""
          [ -n "$LAST_DATE" ] && ARGS="--last-date $LAST_DATE"
          [ "$MANUAL" = "true" ] && ARGS="$ARGS --force"
          node scripts/release-plan.mjs $ARGS

      - name: Remember which version of the notes file was published
        id: hash
        run: echo "hash=$(git hash-object RELEASE-NOTES-NEXT.md)" >> "$GITHUB_OUTPUT"

  publish:
    needs: plan
    # A manual run only publishes when "Actually publish" is ticked.
    if: needs.plan.outputs.release == 'true' && (github.event_name == 'schedule' || inputs.publish)
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      notes: ${{ needs.plan.outputs.notes }}
    permissions:
      contents: write

  reset-notes:
    needs: [plan, publish]
    # Only after a real, successful publish.
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Empty RELEASE-NOTES-NEXT.md back to its header comment
        env:
          PUBLISHED_HASH: ${{ needs.plan.outputs.notes_file_hash }}
        run: |
          # If someone added headlines after the release was planned, leave
          # them for the next release rather than wiping them.
          if [ "$(git hash-object RELEASE-NOTES-NEXT.md)" != "$PUBLISHED_HASH" ]; then
            echo "Notes file changed since the release was planned; leaving it alone."
            exit 0
          fi
          # Keep everything up to and including the closing comment marker.
          awk '{ print } /-->/ { exit }' RELEASE-NOTES-NEXT.md > notes.tmp
          mv notes.tmp RELEASE-NOTES-NEXT.md
          if git diff --quiet; then echo "Nothing to reset."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Reset release notes after ${{ needs.plan.outputs.version }}"
          git push origin HEAD:main
