name: Backlog board

# Keeps the board "Between Us backlog" in step with the backlog labels (owner, 2026-10-31).
# A label change moves the card at once; a card dragged on the board changes the labels on the
# next 15-minute check. Script and rules: scripts/backlog-board.mjs.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only report what would change
        type: boolean
        default: true

permissions:
  issues: write

concurrency:
  group: backlog-board
  cancel-in-progress: false

jobs:
  # The owner's comment on a backlog item gets the label "Owner comment", so every session sees
  # it at the start (project.md, "The backlog"). Claude's own comments end with the Claude Code
  # footer and are skipped.
  owner-comment:
    if: github.event_name == 'issue_comment' && !github.event.issue.pull_request && !contains(github.event.comment.body, 'Generated by [Claude Code]') && github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels" \
            -d '{"labels":["Owner comment"]}'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/backlog-board.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          BOARD_TOKEN: ${{ secrets.BOARD_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
