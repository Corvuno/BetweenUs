name: Build single-file version

# On-demand build: merges styles.css/questions.js/app.js into one standalone
# HTML file per profile, for handing someone a single file to double-click
# and play offline. The split source in the repo stays the source of truth —
# this just produces a disposable, downloadable copy.
#
# Run it from the Actions tab -> "Build single-file version" -> "Run workflow",
# pick a profile, then download the "between-us-single-file" artifact from
# the finished run.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which version to build"
        required: true
        default: public
        type: choice
        options:
          - public
          - work
          - dev
          - all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node scripts/build-single-file.mjs "${{ inputs.profile }}"

      - uses: actions/upload-artifact@v4
        with:
          name: between-us-single-file
          path: dist/*.html
          retention-days: 30
