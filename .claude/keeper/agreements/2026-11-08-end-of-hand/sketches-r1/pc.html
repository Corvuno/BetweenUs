<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Under the Card, PC</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Poiret+One&family=Cormorant+Garamond:ital@0;1&family=Playfair+Display:ital@1&display=swap">
<style>:root{color-scheme:dark}body{margin:0;background:#0b0a08;color:#e9dfc8;font:15px 'Jost',sans-serif}
a{color:#c9a84c;display:inline-block;padding:14px 16px}.s{overflow-x:auto}.s svg{width:1440px;height:900px;display:block}
h2{font:500 12px 'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#c9a84c;padding:0 16px;margin:18px 0 8px}</style></head>
<body><a href="index.html">&lsaquo; Back to the overview</a><h2>PC &middot; a card up (1440 &times; 900, real size)</h2><div class="s" id="a"></div>
<h2>PC &middot; end of a hand</h2><div class="s" id="b"></div>
<script>// Rough sketches of the combined design (round 2: A + B + C). Drawn from scratch as SVG, not taken from the app.
const C = { bg:'#0d0b09', card:'#1b1814', gold:'#c9a84c', goldDim:'rgba(201,168,76,.45)', cream:'#e9dfc8',
  muted:'#8f8573', quiet:'#a39985', wish:'#a874d6', pause:'#3fb7b0', blue:'#5aa6d6', hint:'#8a816f' };
const F = { deco:"'Poiret One','Jost',sans-serif", sans:"'Jost',sans-serif", serif:"'Playfair Display','Cormorant Garamond',serif", ital:"'Cormorant Garamond',serif" };

const t = (x,y,s,o={}) => `<text x="${x}" y="${y}" fill="${o.fill||C.cream}" font-family="${o.ff||F.sans}" font-size="${o.fs||12}" ${o.ls?`letter-spacing="${o.ls}"`:''} text-anchor="${o.a||'middle'}" ${o.it?'font-style="italic"':''} ${o.w?`font-weight="${o.w}"`:''}>${s}</text>`;
const r = (x,y,w,h,o={}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${o.fill||'none'}" ${o.st?`stroke="${o.st}" stroke-width="${o.sw||1}"`:''}/>`;
const l = (x1,y1,x2,y2,st,sw=1,op=1) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${st}" stroke-width="${sw}" opacity="${op}"/>`;

function header(cx, y, small) {
  const k = small ? 1 : .9;
  return t(cx,y,'Between Us',{ff:F.deco,fs:34*k,fill:C.gold,ls:3})
    + l(cx-150*k,y+38*k,cx+150*k,y+38*k,C.goldDim,1)
    + `<rect x="${cx-9}" y="${y+29*k}" width="18" height="18" transform="rotate(45 ${cx} ${y+38*k})" fill="#c98a3c" stroke="${C.gold}"/>`
    + t(cx,y+68*k,'JUST ENOUGH EDGE.',{fs:10.5*k,fill:C.muted,ls:2.5});
}
function cardFace(x,y,w,h,col) {
  return r(x,y,w,h,{fill:C.card,st:'rgba(201,168,76,.35)'}) + r(x,y,w,3,{fill:col})
    + `<path d="M${x+22} ${y+52} V${y+22} H${x+52}" stroke="${C.goldDim}" fill="none"/>`
    + `<path d="M${x+w-22} ${y+h-52} V${y+h-22} H${x+w-52}" stroke="${C.goldDim}" fill="none"/>`;
}
function question(cx,cy,lines,cat,col,fs) {
  let s = t(cx,cy-fs*1.15*lines.length/2 - fs*.6,cat,{fs:fs*.62,fill:col,ls:3,w:500});
  lines.forEach((ln,i)=> s += t(cx,cy - fs*1.15*(lines.length/2-1) + i*fs*1.5,ln,{ff:F.serif,fs,it:1}));
  return s;
}
function intermezzo(x,y,w,h,col) {
  const id='lat'+Math.round(x+y+w);
  const iw=w*.62, ih=h*.7, ix=x+(w-iw)/2, iy=y+(h-ih)/2, cx=x+w/2;
  return `<defs><pattern id="${id}" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M0 0L22 22M22 0L0 22" stroke="rgba(201,168,76,.22)" stroke-width=".8"/></pattern></defs>`
    + r(x,y,w,h,{fill:C.card,st:'rgba(201,168,76,.35)'}) + r(x,y,w,h,{fill:`url(#${id})`})
    + r(ix,iy,iw,ih,{fill:C.card,st:C.goldDim}) + r(ix+10,iy+10,iw-20,ih-20,{st:'rgba(201,168,76,.3)'})
    + `<path d="M${cx-ih*.16} ${iy+ih*.5} A${ih*.16} ${ih*.16} 0 0 1 ${cx+ih*.16} ${iy+ih*.5}" stroke="${C.gold}" fill="none" stroke-width="1.4"/>`
    + `<rect x="${cx-5}" y="${iy+ih*.43}" width="10" height="10" transform="rotate(45 ${cx} ${iy+ih*.43+5})" fill="${col}"/>`
    + t(cx,iy+ih*.7,'INTERMEZZO',{fs:Math.max(11,ih*.09),fill:C.quiet,ls:Math.max(3,ih*.025)});
}
function listSide(x,y,w,h,col) {
  const cx=x+w/2; let s = r(x,y,w,h,{fill:C.card,st:'rgba(201,168,76,.35)'}) + r(x,y,w,3,{fill:col});
  s += t(cx,y+h*.2,'TONIGHT’S FIVE',{fs:Math.max(9,h*.045),fill:C.muted,ls:3});
  const qs=['Which smell takes you straight back…','What do you want that would surprise…','What did you believe as a child…','Which habit did you pick up from…','What would you do with a free Tuesday…'];
  const cols=[C.wish,'#c98a3c','#6f9a5a',C.blue,col];
  qs.forEach((q,i)=>{ const yy=y+h*.32+i*h*.12; s += r(x+w*.12,yy-h*.03,3,h*.05,{fill:cols[i]}) + t(x+w*.12+12,yy+3,q,{ff:F.serif,fs:Math.max(10,h*.05),it:1,a:'start'}); });
  return s;
}
// ticks + optional count. done = how many lit; col = colours
function ticks(x,y,w,n,done,cols,end) {
  const g=6, dw=14, sw=(w-dw-g*n)/n; let s='';
  for(let i=0;i<n;i++) s += r(x+i*(sw+g),y,sw,4,{fill: i<done ? cols[i] : '#2c2721'});
  s += `<rect x="${x+w-10}" y="${y-3}" width="9" height="9" transform="rotate(45 ${x+w-5.5} ${y+1.5})" fill="${end?'#e9c97a':'none'}" stroke="#e9c97a" stroke-width="1"/>`;
  return s;
}
function bar(cx,y,w,h,label,col,lines,lineW) {
  const lc = lines;
  let s = r(cx-w/2,y,w,h,{fill:col}) + t(cx,y+h/2+4.5,label,{fs:13,fill:'#14110d',ls:2.2});
  if (lineW) [-7,0,7].forEach((d,i)=>{ const inset = i===1?0:16;
    s += l(cx-w/2-8,y+h/2+d,cx-w/2-8-lineW+inset,y+h/2+d,lc,1,.7) + l(cx+w/2+8,y+h/2+d,cx+w/2+8+lineW-inset,y+h/2+d,lc,1,.7); });
  return s;
}
function lineDefs(col) {
  const k=col.replace('#','');
  return `<defs><linearGradient id="fl${k}" x1="1" x2="0"><stop offset="0" stop-color="${col}" stop-opacity=".8"/><stop offset="1" stop-color="${col}" stop-opacity=".15"/></linearGradient>`
    + `<linearGradient id="fr${k}" x1="0" x2="1"><stop offset="0" stop-color="${col}" stop-opacity=".8"/><stop offset="1" stop-color="${col}" stop-opacity=".15"/></linearGradient></defs>`;
}
function word(x,y,s,a,o={}) { return t(x,y,s,{fs:o.fs||11.5,fill:o.fill||C.quiet,ls:2.6,a}); }
function hint(x,y,lines,a) { return lines.map((s,i)=>t(x,y+i*16,s,{ff:F.ital,fs:15,it:1,fill:C.hint,a})).join(''); }
function note(x,y,s,a='middle') { return `<g>${t(x,y,s,{fs:12,fill:'#f0b46a',a,w:500})}</g>`; }

// ── phone (412 × 915) ──
function phone(state) {
  const W=412, H=915, cx=W/2; const pauseCol=C.pause;
  const isEnd = state==='end' || state==='list';
  const barCol = state==='start' ? C.gold : isEnd ? pauseCol : C.gold;
  let s = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">` + lineDefs(C.gold) + lineDefs(pauseCol) + r(0,0,W,H,{fill:C.bg});
  s += header(cx,140,true);
  s += t(cx,252,'Selected deck · tap to change',{fs:13,fill:C.muted}) + t(cx,275,'BALANCED',{fs:14,fill:C.blue,ls:3}) + l(100,290,312,290,'rgba(143,133,115,.3)');
  const cxC=18, cyC=321, cw=376, ch=245;
  if (state==='start') s += intermezzo(cxC,cyC,cw,ch,C.gold).replace('INTERMEZZO','BETWEEN US');
  else if (state==='card') s += cardFace(cxC,cyC,cw,ch,C.wish) + question(cx,cyC+ch/2+8,['What do you want that would','surprise the people who know you?'],'WISH',C.wish,19);
  else if (state==='end') s += intermezzo(cxC,cyC,cw,ch,pauseCol);
  else if (state==='list') s += listSide(cxC,cyC,cw,ch,pauseCol);
  const cols=[C.wish,'#c98a3c','#6f9a5a',C.blue,pauseCol];
  if (state!=='start') { s += ticks(18,579,376,5, state==='card'?2:5, cols, isEnd); s += t(cx,606,state==='card'?'2 / 5':'5 / 5',{fs:15,fill:C.gold,ls:4}); }
  const label = state==='start'?'DRAW CARD': state==='card'?'NEXT CARD': state==='end'?'TAP TO FLIP CARD':'HOLD TO CONTINUE';
  s += bar(cx,620,186,34,label,barCol, isEnd?pauseCol:C.gold, 80);
  if (state==='start' || state==='card') {
    s += word(25,684,'SPOTLIGHT','start', state==='start'?{fill:'#5a5347'}:{}) + word(387,684,'MENU','end');
    if (state==='card') s += hint(25,706,['the question takes','the stage'],'start');
  } else {
    s += word(25,684,'SAVE','start') + word(387,684,'MENU','end');
    s += hint(25,706,['take this evening','with you'],'start');
  }
  s += '</svg>';
  return s;
}
function phoneMenu() {
  const W=412,H=915; let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">`+r(0,0,W,H,{fill:'#070605'})+r(0,340,W,575,{fill:'#1d1a16'});
  s += r(186,356,40,2,{fill:C.goldDim}) + t(26,404,'Tonight',{ff:F.ital,fs:18,fill:C.muted,a:'start'});
  const row=(y,lbl,sub,act,hi)=> t(62,y-3,lbl,{fs:12,fill:hi?C.gold:C.cream,ls:2,a:'start'}) + t(62,y+21,sub,{ff:F.ital,fs:17,fill:hi?C.cream:C.cream,a:'start'}) + t(386,y+6,act,{ff:F.ital,fs:15,fill:hi?C.gold:C.muted,a:'end'});
  s += row(450,'SAVE','take this evening with you','Save',1);
  s += t(62,494,'saved as one file you can send or keep',{ff:F.ital,fs:14,it:1,fill:C.hint,a:'start'});
  s += row(540,'THE DECK','Balanced, five cards','Change');
  s += row(611,'START OVER','2 seen, 238 left','Shuffle');
  s += row(682,'TWIST','same question, new angle','Twist');
  s += l(26,718,386,718,'rgba(143,133,115,.25)') + t(26,754,'Yours',{ff:F.ital,fs:18,fill:C.muted,a:'start'});
  s += row(800,'PLAYED','2 drawn so far','Open') + row(871,'FAVOURITES','None starred yet','Open');
  return s+'</svg>';
}
// ── PC (1440 × 900) ──
function pc(state) {
  const W=1440,H=900,cx=W/2, pauseCol=C.pause, isEnd=state==='end';
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">`+r(0,0,W,H,{fill:C.bg});
  s += header(cx,46,false);
  s += t(266,26,'Selected deck · click to change',{fs:12,fill:C.muted,a:'start'}) + t(266,48,'BALANCED',{fs:16,fill:C.blue,ls:3,a:'start'});
  s += word(266,84,'MENU','start',{fs:12.5});
  s += word(1164,30,isEnd?'SAVE':'SPOTLIGHT','end',{fs:12.5});
  if (isEnd) s += hint(1164,52,['take this evening with you'],'end');
  const x=276,y=114,w=888,h=560;
  if (state==='card') s += cardFace(x,y,w,h,C.wish) + question(cx,y+h/2+10,['What do you want that would surprise','the people who know you?'],'WISH',C.wish,40);
  else s += intermezzo(x,y,w,h,pauseCol);
  const cols=[C.wish,'#c98a3c','#6f9a5a',C.blue,pauseCol];
  s += ticks(x,694,w,5,isEnd?5:2,cols,isEnd);
  s += t(cx,734,isEnd?'5 / 5':'2 / 5',{fs:16,fill:C.gold,ls:5});
  s += bar(cx,752,209,36,isEnd?'TAP TO FLIP CARD':'NEXT CARD',isEnd?pauseCol:C.gold,null,0);
  return s+'</svg>';
}
function pcMenu() {
  let s = pc('card').replace('</svg>','');
  s += r(250,96,380,420,{fill:'#1d1a16',st:'rgba(201,168,76,.25)'});
  const row=(y,lbl,sub,act,hi)=> t(276,y,lbl,{fs:12,fill:hi?C.gold:C.cream,ls:2,a:'start'}) + t(276,y+22,sub,{ff:F.ital,fs:17,a:'start'}) + t(604,y+10,act,{ff:F.ital,fs:15,fill:hi?C.gold:C.muted,a:'end'});
  s += t(276,130,'Tonight',{ff:F.ital,fs:18,fill:C.muted,a:'start'});
  s += row(170,'SAVE','take this evening with you','Save',1) + t(276,214,'saved as one file you can send or keep',{ff:F.ital,fs:14,it:1,fill:C.hint,a:'start'});
  s += row(250,'THE DECK','Balanced, five cards','Change') + row(310,'START OVER','2 seen, 238 left','Shuffle') + row(370,'TWIST','same question, new angle','Twist');
  s += t(276,430,'Yours',{ff:F.ital,fs:18,fill:C.muted,a:'start'}) + row(464,'PLAYED','2 drawn so far','Open');
  return s+'</svg>';
}

document.getElementById('a').innerHTML=pc('card');document.getElementById('b').innerHTML=pc('end');
document.addEventListener('keydown',e=>{if(e.key==='Escape')location.href='index.html'});</script></body></html>
