<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Be Free wall posters</title>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Bodoni+Moda:ital,wght@0,400;1,400&family=Jost:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0a;--card-bg:#1a1612;--gold:#c9a84c;--gold-l:#e8c97a;--cream:#f0e8d8;--dim:rgba(201,168,76,.12);--border:rgba(201,168,76,.22);--border-strong:rgba(201,168,76,.38);--navy:#0b1120;--prompt-size:76px}
*{box-sizing:border-box;margin:0;padding:0}

html,body{background:#888}
.sheet{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;margin:0 auto}
.art{position:absolute;inset:0;background:var(--bg);overflow:hidden}
.sheet.margin .art{inset:8mm}
.art.navy{background:var(--navy)}
.art>svg.bgfx{position:absolute;inset:0;width:100%;height:100%}
/* the card: inset from the art edge, the app's own frame (border, rail, two corner brackets) */
.card{position:absolute;inset:12mm;background:var(--card-bg);border:1.5px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.card::before,.card::after{content:'';position:absolute;width:44px;height:44px;border:solid var(--gold);opacity:.5;z-index:3}
.card::before{top:30px;left:30px;border-width:1.5px 0 0 1.5px}
.card::after{bottom:30px;right:30px;border-width:0 1.5px 1.5px 0}
.rail{position:absolute;top:0;left:0;right:0;height:5px;z-index:3;opacity:.85;background:linear-gradient(100deg,#7a6320 0%,#a98a35 34%,var(--gold-l) 50%,#a98a35 66%,#7a6320 100%);-webkit-mask:linear-gradient(to right,transparent 0%,#000 14% 86%,transparent 100%);mask:linear-gradient(to right,transparent 0%,#000 14% 86%,transparent 100%)}
.card>svg.cfx{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.prompt{position:relative;z-index:2;font-family:'Bodoni Moda','Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:var(--prompt-size);line-height:1.34;text-align:center;color:var(--cream);text-wrap:balance;width:min(620px,88%)}
.sym{display:block;height:4cm;width:auto;position:relative;z-index:2}
.mark{display:block;width:150px;height:auto;overflow:visible;color:var(--gold);position:relative;z-index:2}
.mark path[fill]{fill:var(--gold)}
.rule{width:80px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);position:relative;z-index:2}
.fill{flex:1}
.stack{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;width:100%}
.credit{font-family:'Bodoni Moda',serif;font-style:normal;font-weight:400;font-size:23px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold-l);position:relative;z-index:2;padding-left:.34em;text-align:center}

.rail{height:9px}
.card::before,.card::after{width:64px;height:64px}
.card::before{top:34px;left:34px}.card::after{bottom:34px;right:34px}
.prompt{width:auto;white-space:nowrap}.prompt span{display:block}
.label{font-family:'Jost',sans-serif;font-weight:600;font-size:24px;letter-spacing:.16em;text-transform:uppercase;position:relative;z-index:2;padding-left:.16em;margin-bottom:26px}
.mid{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.card .mark{width:150px}
.title{font-family:'Poiret One',cursive;font-size:36px;font-weight:400;letter-spacing:.1em;color:var(--gold-l);line-height:1;padding-left:.1em;position:relative;z-index:2}
.land .card{flex-direction:row}
.land .side{width:200px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;position:relative;z-index:2}
.land .mid{flex:1}
.land .title{font-size:28px}
html,body{margin:0;background:#fff}
.pg{position:relative;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.pg:last-child{break-after:auto;page-break-after:auto}
.trim{position:absolute}
.art{overflow:hidden}
.crop{position:absolute;inset:0;width:100%;height:100%}
@page{size:297mm 210mm;margin:0}</style></head><body><section class="pg land" style="width:297mm;height:210mm"><div class="trim" style="left:0mm;top:0mm;width:297mm;height:210mm"><div class="art navy" style="inset:0mm">
