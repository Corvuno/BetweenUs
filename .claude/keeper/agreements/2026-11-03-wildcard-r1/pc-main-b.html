<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wildcard PC main b</title>
<style>:root{--bg:#0e0c0a;--gold:#c9a84c}html,body{margin:0;height:100%;background:var(--bg)}
img{width:100vw;height:100vh;object-fit:contain;display:block}
a{position:fixed;top:14px;left:16px;font:400 14px/1 Jost,system-ui,sans-serif;letter-spacing:.12em;color:#a9c7b6;text-decoration:none;opacity:0;transition:opacity .3s;padding:8px}
body.show a{opacity:1}</style></head><body><img src="img/pc-main-b.png" alt="B. Gilt title and frame"><a href="index.html">&lsaquo; Overview</a>
<script>let t;const b=document.body;addEventListener('mousemove',()=>{b.classList.add('show');clearTimeout(t);t=setTimeout(()=>b.classList.remove('show'),2000)});
addEventListener('keydown',e=>{if(e.key==='Backspace'||e.key.toLowerCase()==='b'||e.key==='Escape')location.href='index.html'})</script></body></html>
