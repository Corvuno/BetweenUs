<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=412">
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Federo&family=Jost:wght@300;400&family=Cormorant+Garamond:ital@1&family=Bodoni+Moda:ital@1&display=swap" rel="stylesheet">
<style>
/* Rough sketch, drawn from scratch (not the live app). Tokens from DESIGN-SYSTEM.md. */
:root{--bg:#0e0c0a;--card:#1a1612;--gold:#c9a84c;--gold-l:#e8c97a;--cream:#f0e8d8;--cel:#A9C7B6;--hint:#8a9d92;--dim:rgba(201,168,76,.12);--border:rgba(201,168,76,.22);--strong:rgba(201,168,76,.38);--rose:#d77fa6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--cream);width:412px;height:915px;overflow:hidden;font-family:Jost}
.hd{text-align:center;padding-top:56px}
.hd .t{font:400 34px 'Poiret One';letter-spacing:.1em;color:var(--gold-l)}
.hd .orn{width:230px;height:22px;margin:8px auto 0;display:block}
.hd .tag{font-size:11px;letter-spacing:.16em;color:#9c8f7e;margin-top:8px}
.sel{margin-top:22px;text-align:center;font:400 13px Federo;color:#9c8f7e}.sel b{display:block;font:400 15px Jost;letter-spacing:.2em;color:#4aa3c9;margin-top:4px}
.sel .mi{display:inline-block;width:14px;height:10px;margin-right:7px;vertical-align:1px;background:linear-gradient(var(--cel),var(--cel)) 0 0/14px 1.4px no-repeat,linear-gradient(var(--cel),var(--cel)) 0 4.3px/9px 1.4px no-repeat,linear-gradient(var(--cel),var(--cel)) 0 8.6px/5px 1.4px no-repeat}
.card{position:relative;margin:26px 18px 0;height:250px;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;box-shadow:0 0 30px rgba(0,0,0,.5)}
.card::before{content:'';position:absolute;top:0;left:12px;right:12px;height:3px;background:linear-gradient(90deg,transparent,var(--rose),transparent)}
.card i{position:absolute;width:22px;height:22px;border:solid var(--strong)}.card i.a{top:18px;left:18px;border-width:1px 0 0 1px}.card i.b{bottom:18px;right:18px;border-width:0 1px 1px 0}
.card .c{font:400 15px Jost;letter-spacing:.18em;color:var(--rose)}.card .q{font:italic 400 22px 'Bodoni Moda';text-align:center;padding:0 36px;line-height:1.5}
.lbl{font:400 11px Federo;letter-spacing:.2em;text-transform:uppercase;color:var(--cel)}
.hint{font:italic 400 15px 'Cormorant Garamond';color:var(--hint)}
svg.g{width:22px;height:22px;stroke:var(--cel);fill:none;stroke-width:1.5}
/* 1 · the hand */
.hand{position:relative;margin:0 18px;height:120px}
.back{position:absolute;left:var(--x);right:var(--x);top:var(--y);height:250px;background:#16120e;border:1px solid var(--strong);border-top:none;
  background-image:repeating-linear-gradient(45deg,rgba(201,168,76,.10) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,rgba(201,168,76,.10) 0 1px,transparent 1px 14px)}
.hand .edge{position:absolute;left:var(--x);right:var(--x);top:var(--y);height:3px;display:flex;gap:2px}
.hand .face{position:absolute;left:30px;right:30px;top:22px;height:58px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px}
.under{position:absolute;left:0;right:0;top:auto;bottom:0}
/* 2 · the dial */
.dial{position:relative;width:340px;height:200px;margin:18px auto 0}
/* 4 · the programme */
.prog{margin:22px 18px 0;text-align:center}
.prog .ttl{font:400 12px Federo;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.acts{display:flex;justify-content:center;gap:0;margin-top:14px;border-top:1px solid var(--strong);border-bottom:1px solid var(--strong)}
.act{flex:1;padding:12px 0 10px;font:400 22px 'Poiret One';color:#6f6457;border-left:1px solid var(--dim)}.act:first-child{border-left:none}
.act.past{color:#a89678}.act.now{color:var(--gold-l);background:rgba(201,168,76,.08);position:relative}
.act.now::after{content:'';position:absolute;left:30%;right:30%;bottom:5px;height:1px;background:var(--gold-l)}
.act small{display:block;font:400 9px Federo;letter-spacing:.2em;color:inherit;opacity:.8;margin-top:2px}
.house{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:12px}
</style></head><body>
<div class="hd"><div class="t">Between Us</div>
<svg class="orn" viewBox="0 0 230 22" fill="none" stroke="#c9a84c"><path d="M0 11H96M134 11H230" opacity=".5"/><path d="M70 5H105M125 5H160M70 17H105M125 17H160" stroke="#4aa3c9"/><path d="M104 11 115 2 126 11 115 20Z" fill="#c67b28" stroke="none"/></svg>
<div class="tag">JUST ENOUGH EDGE.</div></div>
<div class="sel" id="sel">Selected deck<b>BALANCED</b></div>
<div class="card"><i class="a"></i><i class="b"></i><div class="c">US: LOVE</div><div class="q">Is there a version of me you miss?</div></div>
<div id="low"></div>
<script>
const v = new URLSearchParams(location.search).get('v'), hints = location.search.includes('h=1');
const G = {spot:'<svg class="g" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><rect x="8" y="8" width="8" height="8"/></svg>',
  menu:'<svg class="g" viewBox="0 0 24 24"><path d="M4 7h16M4 12h11M4 17h6"/></svg>'};
const low = document.getElementById('low'), sel = document.getElementById('sel');
const cols = ['#7a4f9a','#7a4f9a','#d77fa6'];
if (v === '1') {           // the hand: two cards left in a hand of five; coloured line on the stack edge
  sel.innerHTML = '<span class="mi"></span>Selected deck<b>BALANCED</b>';
  low.innerHTML = `<div class="hand" style="margin-top:-2px">
   <div class="back" style="--x:18px;--y:0;height:104px;opacity:.75"></div>
   <div class="back" style="--x:9px;--y:0;height:90px"></div>
   <div class="edge" style="--x:9px;--y:87px">${[0,1,2,3,4].map(i=>`<i style="flex:1;background:${i<3?cols[i]:'rgba(201,168,76,.15)'};opacity:${i==2?1:.6}"></i>`).join('')}</div>
   <div class="face"><span class="lbl" style="color:var(--gold-l);font-size:13px">Draw</span><span class="hint">${hints?'tap the hand for the next card':'2 left'}</span></div></div>
   <div style="text-align:center;margin-top:26px">${G.spot}<div class="lbl" style="margin-top:6px">Spotlight</div><div class="hint" style="margin-top:6px;min-height:20px">${hints?'the question fills the screen':''}</div></div>`;
}
if (v === '2') {           // the dial: one notch per question; knob is Spotlight; feet: Menu (left), count (right)
  const n = 5, cur = 3, R = 140, cx = 170, cy = 186;
  let ticks = '';
  for (let i = 0; i < n; i++) { const a = Math.PI * (1 - (i + .5) / n), x = cx + R * Math.cos(a), y = cy - R * Math.sin(a), xi = cx + (R-18) * Math.cos(a), yi = cy - (R-18) * Math.sin(a), xt = cx + (R+18) * Math.cos(a), yt = cy - (R+18) * Math.sin(a);
    ticks += `<line x1="${xi}" y1="${yi}" x2="${x}" y2="${y}" stroke="${i<cur?'#c9a84c':'rgba(201,168,76,.4)'}" stroke-width="${i==cur-1?2.2:1.2}"/><text x="${xt}" y="${yt+6}" text-anchor="middle" font-family="Poiret One" font-size="17" fill="${i==cur-1?'#e8c97a':i<cur?'#a89678':'#6f6457'}">${i+1}</text>`; }
  const na = Math.PI * (1 - (cur - .5) / n);
  const face = hints ? `<text x="${cx-58}" y="${cy-42}" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-size="14" fill="#8a9d92"><tspan x="${cx-62}">turn to the</tspan><tspan x="${cx-62}" dy="16">next card</tspan></text>` : '';
  low.innerHTML = `<div class="dial" style="height:268px;margin-top:8px"><svg width="340" height="232" viewBox="0 0 340 232">
   <path d="M30 186A140 140 0 0 1 310 186" fill="none" stroke="rgba(201,168,76,.55)"/><path d="M50 186A120 120 0 0 1 290 186" fill="none" stroke="rgba(201,168,76,.28)"/>
   <line x1="20" y1="186.5" x2="320" y2="186.5" stroke="rgba(201,168,76,.3)"/>
   ${face}${ticks}<line x1="${cx}" y1="${cy}" x2="${cx+112*Math.cos(na)}" y2="${cy-112*Math.sin(na)}" stroke="#e8c97a" stroke-width="1.5"/>
   <circle cx="${cx}" cy="${cy}" r="34" fill="#16120e" stroke="#c9a84c"/><circle cx="${cx}" cy="${cy}" r="28" fill="none" stroke="rgba(201,168,76,.35)"/>
   <rect x="${cx-9}" y="${cy-9}" width="18" height="18" fill="none" stroke="#A9C7B6" stroke-width="1.4"/><rect x="${cx-4}" y="${cy-4}" width="8" height="8" fill="none" stroke="#A9C7B6" stroke-width="1.4"/></svg>
   <div style="position:absolute;left:0;right:0;top:206px;display:grid;grid-template-columns:1fr auto 1fr;align-items:start">
    <span style="display:flex;align-items:center;gap:8px"><svg class="g" viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M4 7h16M4 12h11M4 17h6"/></svg><span class="lbl">Menu</span></span>
    <span class="lbl" style="margin-top:20px">Spotlight</span>
    <span style="justify-self:end;font:400 15px 'Poiret One';letter-spacing:.3em;color:#c9a84c">3 / 5</span></div>
   <div class="hint" style="position:absolute;left:0;right:0;top:246px;text-align:center">${hints?'press the knob: the question fills the screen':''}</div></div>`;
}
if (v === '4') {           // the programme: acts I–V; tap the next act; earlier acts go back; title opens Menu
  sel.style.visibility = 'hidden';   // the programme's title names the deck instead
  const acts = ['I','II','III','IV','V'];
  low.innerHTML = `<div class="prog"><div class="ttl"><span class="mi" style="display:inline-block;width:14px;height:10px;margin-right:8px;background:linear-gradient(#A9C7B6,#A9C7B6) 0 0/14px 1.4px no-repeat,linear-gradient(#A9C7B6,#A9C7B6) 0 4.3px/9px 1.4px no-repeat,linear-gradient(#A9C7B6,#A9C7B6) 0 8.6px/5px 1.4px no-repeat"></span>Tonight's programme · Balanced</div>
   <div class="acts">${acts.map((a,i)=>`<div class="act ${i<2?'past':i==2?'now':''}">${a}</div>`).join('')}</div>
   <div class="hint" style="margin-top:10px;min-height:20px">${hints?'tap the next act to go on, an earlier one to go back':''}</div>
   <div class="house">${G.spot}<span class="lbl">House lights down · Spotlight</span></div></div>`;
}
</script></body></html>
