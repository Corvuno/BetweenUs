<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Us Colleagues colour</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Cormorant+Garamond:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e0c0a;--cream:#f0e8d8;--gold:#c9a84c;--muted:#9c8f7e;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font-family:'Cormorant Garamond',serif;font-size:1.15rem;line-height:1.5;padding:24px 16px 60px}
main{max-width:1700px;margin:0 auto}
h1{font:300 1.5rem 'Jost',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
p{margin:0 0 10px;max-width:44rem;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(390px,100%),1fr));gap:22px;margin-top:22px}
figure{margin:0}
figcaption{font:400 .85rem 'Jost',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
figcaption span{color:var(--muted);text-transform:none;letter-spacing:.02em;font-size:.95rem}
img{display:block;width:100%;max-width:390px;height:auto;border-radius:4px}
</style></head><body><main>
<h1>Us: Colleagues · colour</h1>
<p>The real app on a phone, The Deck open on the Between Us chapter. First as it is now, then with Us: Colleagues added in three colours from the Us family.</p>
<div class="row">
<figure><figcaption>Now <span>(three Us categories)</span></figcaption><img src="img/current.png" alt="The Between Us chapter as it is now"></figure>
<figure><figcaption>A · Wheat <span>#e6c79c</span></figcaption><img src="img/a.png" alt="Us: Colleagues in wheat"></figure>
<figure><figcaption>B · Dusty lilac <span>#c4a3c8</span></figcaption><img src="img/b.png" alt="Us: Colleagues in dusty lilac"></figure>
<figure><figcaption>C · Ash rose <span>#bfa0a3</span></figcaption><img src="img/c.png" alt="Us: Colleagues in ash rose"></figure>
</div>
</main></body></html>
