<title>Between Us Backlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Poiret+One&display=swap">
<style>
/* Layout: one readable column; sections stacked in queue order; each story a card with its criteria as a numbered checklist. */
:root{
  --bg:#f6f4ef; --surface:#fffdf8; --fg:#1d1b22; --muted:#5f5a66; --line:#d9d2c3;
  --gold:#9a7417; --gold-soft:#efe3c2;
  --a:#7a3b8f; --b:#1f6f73; --c:#a4471f;
  --now:#1f6f73; --next:#6a5a1c; --wait:#a4471f; --park:#6d6873; --done:#3f7a3a;
  --display:"Poiret One", "Didot", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15131a; --surface:#1d1a23; --fg:#f0ece4; --muted:#b0a9b8; --line:#3a3442;
  --gold:#d8b25a; --gold-soft:#3a3020;
  --a:#c58ad8; --b:#6cc3c7; --c:#e6936a;
  --now:#6cc3c7; --next:#d8c26a; --wait:#e6936a; --park:#a9a3b0; --done:#8fca85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131a; --surface:#1d1a23; --fg:#f0ece4; --muted:#b0a9b8; --line:#3a3442;
  --gold:#d8b25a; --gold-soft:#3a3020;
  --a:#c58ad8; --b:#6cc3c7; --c:#e6936a;
  --now:#6cc3c7; --next:#d8c26a; --wait:#e6936a; --park:#a9a3b0; --done:#8fca85; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:18px;line-height:1.6}
.wrap{max-width:46rem;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:28px}
header{display:flex;flex-direction:column;gap:6px;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:2.4rem;letter-spacing:.06em;margin:0;text-wrap:balance}
.rule{height:14px;background:
  linear-gradient(var(--gold),var(--gold)) center/100% 1px no-repeat;position:relative;margin:4px auto 0;width:min(320px,80%)}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 4px var(--bg)}
.sub{color:var(--muted);font-size:.95rem}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
nav a{display:inline-flex;gap:6px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-size:.95rem;background:var(--surface)}
nav a:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
nav b{font-variant-numeric:tabular-nums}
section{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
h2{font-family:var(--display);font-weight:400;font-size:1.6rem;letter-spacing:.05em;margin:0;display:flex;align-items:center;gap:12px}
h2 .dot{width:10px;height:10px;transform:rotate(45deg);background:var(--k)}
h2 .count{font-family:var(--body);font-size:.9rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;margin:0}
article{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--k);border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
article h3{margin:0;font-size:1.15rem;line-height:1.35;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.8rem;letter-spacing:.04em;padding:2px 9px;border-radius:999px;border:1px solid currentColor;font-weight:700}
.chip.A{color:var(--a)} .chip.B{color:var(--b)} .chip.C{color:var(--c)}
.story{margin:0}
.label{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:0}
ol{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:6px}
ol li::marker{color:var(--gold);font-weight:700}
.meta{font-size:.9rem;color:var(--muted);margin:0;overflow-wrap:anywhere}
.note{margin:0;padding:8px 12px;background:var(--gold-soft);border-radius:4px;font-size:.95rem}
details{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 16px}
summary{cursor:pointer;font-weight:700}
details ul{margin:10px 0 4px;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
details li span{color:var(--muted);font-size:.9rem}
.err{color:var(--wait)}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>

<div class="wrap">
  <header>
    <h1>Between Us Backlog</h1>
    <div class="rule" aria-hidden="true"></div>
    <p class="sub" id="updated">One queue for everything. Ask the Keeper to move anything.</p>
    <nav id="nav" aria-label="Sections"></nav>
  </header>
  <main id="main"><p class="empty">Loading the backlog…</p></main>
</div>

<script>
const SECTIONS = [
  {key:'Building now', id:'now',  color:'--now'},
  {key:'Next',         id:'next', color:'--next'},
  {key:'Waiting on the owner', id:'waiting', color:'--wait'},
  {key:'Parked',       id:'parked', color:'--park'},
  {key:'Done',         id:'done', color:'--done'},
];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');

function parse(md){
  const out = {}; let sec = null, story = null, field = null;
  for (const raw of md.split('\n')){
    const line = raw.replace(/\s+$/,'');
    let m;
    if ((m = line.match(/^## (.+)/))){
      const name = m[1].trim();
      sec = SECTIONS.find(s => name.toLowerCase().startsWith(s.key.toLowerCase())) || null;
      if (sec) out[sec.id] = out[sec.id] || []; story = null; continue;
    }
    if (!sec) { if ((m = line.match(/^_Updated (.+)_$/))) out.updated = m[1]; continue; }
    if ((m = line.match(/^### (.+)/))){
      story = {title:m[1].trim(), story:'', criteria:[], touches:'', source:'', note:'', extra:[]};
      out[sec.id].push(story); field = null; continue;
    }
    if (!story) continue;
    if ((m = line.match(/^\*\*Story:\*\*\s*(.*)/))){ story.story = m[1]; field='story'; continue; }
    if (/^\*\*Acceptance criteria:\*\*/.test(line)){ field='criteria'; continue; }
    if ((m = line.match(/^\*\*Touches:\*\*\s*(.*)/))){ story.touches = m[1]; field=null; continue; }
    if ((m = line.match(/^\*\*Source:\*\*\s*(.*)/))){ story.source = m[1]; field=null; continue; }
    if ((m = line.match(/^\*\*Status note:\*\*\s*(.*)/))){ story.note = m[1]; field='note'; continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/)) && field==='criteria'){ story.criteria.push(m[1]); continue; }
    if (line.trim()==='') continue;
    if (field==='criteria' && story.criteria.length && /^\s+/.test(raw)) { story.criteria[story.criteria.length-1] += ' ' + line.trim(); continue; }
    if (field==='story') { story.story += ' ' + line.trim(); continue; }
    if (field==='note') { story.note += ' ' + line.trim(); continue; }
    story.extra.push(line.trim());
  }
  return out;
}

function chips(title){
  const m = title.match(/\((?:Area\s*)?([ABC](?:\s*[\/+,&]\s*[ABC])*)[^)]*\)\s*$/);
  const clean = m ? title.slice(0, m.index).trim() : title;
  const names = {A:'A · Deck', B:'B · Looks', C:'C · App'};
  const areas = m ? [...new Set(m[1].match(/[ABC]/g))] : [];
  return {clean, html: areas.map(a => `<span class="chip ${a}">${names[a]}</span>`).join('')};
}

function card(s, color){
  const c = chips(s.title);
  return `<article style="--k:var(${color})">
    ${c.html ? `<div class="chips">${c.html}</div>` : ''}
    <h3>${inline(c.clean)}</h3>
    ${s.story ? `<p class="story">${inline(s.story)}</p>` : ''}
    ${s.criteria.length ? `<p class="label">Done when</p><ol>${s.criteria.map(x=>`<li>${inline(x)}</li>`).join('')}</ol>` : ''}
    ${s.note ? `<p class="note">${inline(s.note)}</p>` : ''}
    ${s.extra.length ? s.extra.map(x=>`<p class="meta">${inline(x)}</p>`).join('') : ''}
    ${s.touches ? `<p class="meta">Touches: ${inline(s.touches)}</p>` : ''}
    ${s.source ? `<p class="meta">From: ${inline(s.source)}</p>` : ''}
  </article>`;
}

function render(data){
  const main = document.getElementById('main'), nav = document.getElementById('nav');
  if (data.updated) document.getElementById('updated').textContent = 'Updated ' + data.updated + '. Ask the Keeper to move anything.';
  nav.innerHTML = SECTIONS.map(s => `<a href="#${s.id}"><span>${s.key}</span><b>${(data[s.id]||[]).length}</b></a>`).join('');
  main.innerHTML = SECTIONS.map(s => {
    const items = data[s.id] || [];
    const head = `<h2 style="--k:var(${s.color})"><span class="dot" aria-hidden="true"></span>${s.key}<span class="count">${items.length}</span></h2>`;
    if (s.id === 'done'){
      return `<section id="${s.id}">${head}${items.length ? `<details><summary>Show what landed (${items.length})</summary><ul>${
        items.map(i => `<li>${inline(chips(i.title).clean)}${i.source ? ` <span>· ${inline(i.source)}</span>` : ''}</li>`).join('')
      }</ul></details>` : '<p class="empty">Nothing yet.</p>'}</section>`;
    }
    return `<section id="${s.id}">${head}${items.length ? items.map(i => card(i, s.color)).join('') : '<p class="empty">Nothing here.</p>'}</section>`;
  }).join('');
  main.style.display='flex'; main.style.flexDirection='column'; main.style.gap='32px';
  const h = location.hash.slice(1); if (h) document.getElementById(h)?.scrollIntoView();
}

fetch('backlog.md', {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => render(parse(md)))
  .catch(() => { document.getElementById('main').innerHTML = '<p class="err">The backlog file could not be loaded. Ask the Keeper to republish the page.</p>'; });
</script>
