<meta charset="utf-8">
<title>Between Us Backlog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Poiret+One&display=swap">
<style>
/* Kanban: columns left to right in the order work flows (waiting on you, next, building, done), parked last.
   PC: all columns side by side. Phone: one column per screen, swipe sideways or tap a column name. */
:root{
  --bg:#f6f4ef; --col:#ece8df; --surface:#fffdf8; --fg:#1d1b22; --muted:#5f5a66; --line:#d9d2c3;
  --gold:#9a7417; --gold-soft:#efe3c2;
  --a:#7a3b8f; --b:#1f6f73; --c:#a4471f;
  --now:#1f6f73; --next:#6a5a1c; --wait:#a4471f; --park:#6d6873; --done:#3f7a3a;
  --display:"Poiret One", "Didot", Georgia, serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15131a; --col:#1a1720; --surface:#221e29; --fg:#f0ece4; --muted:#b0a9b8; --line:#3a3442;
  --gold:#d8b25a; --gold-soft:#3a3020;
  --a:#c58ad8; --b:#6cc3c7; --c:#e6936a;
  --now:#6cc3c7; --next:#d8c26a; --wait:#e6936a; --park:#a9a3b0; --done:#8fca85; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15131a; --col:#1a1720; --surface:#221e29; --fg:#f0ece4; --muted:#b0a9b8; --line:#3a3442;
  --gold:#d8b25a; --gold-soft:#3a3020;
  --a:#c58ad8; --b:#6cc3c7; --c:#e6936a;
  --now:#6cc3c7; --next:#d8c26a; --wait:#e6936a; --park:#a9a3b0; --done:#8fca85; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55}
header{display:flex;flex-direction:column;gap:6px;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
h1{font-family:var(--display);font-weight:400;font-size:2.3rem;letter-spacing:.06em;margin:0;text-wrap:balance}
.rule{height:14px;background:linear-gradient(var(--gold),var(--gold)) center/100% 1px no-repeat;position:relative;margin:2px auto 0;width:min(320px,80%)}
.rule::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;background:var(--gold);transform:translate(-50%,-50%) rotate(45deg);box-shadow:0 0 0 4px var(--bg)}
.sub{color:var(--muted);font-size:.95rem;margin:0}
nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
nav button{font:inherit;display:inline-flex;gap:7px;align-items:center;padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--fg);font-size:.92rem;background:var(--surface);cursor:pointer}
nav button .dot{width:8px;height:8px;transform:rotate(45deg);background:var(--k)}
nav button b{font-variant-numeric:tabular-nums}
nav button[aria-current="true"]{border-color:var(--k);box-shadow:inset 0 0 0 1px var(--k)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:start;
  padding:6px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));max-width:1700px;margin:0 auto}
.column{background:var(--col);border-radius:10px;border-top:4px solid var(--k);padding:12px 10px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.column.parked{opacity:.88}
h2{font-family:var(--display);font-weight:400;font-size:1.35rem;letter-spacing:.05em;margin:0 4px 2px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 .count{font-family:var(--body);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.hint{margin:-4px 4px 2px;font-size:.82rem;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;margin:4px;font-size:.95rem}

article{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--k);border-radius:6px;padding:12px 13px;display:flex;flex-direction:column;gap:8px;min-width:0}
article h3{margin:0;font-size:1.02rem;line-height:1.35;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:.74rem;letter-spacing:.04em;padding:1px 8px;border-radius:999px;border:1px solid currentColor;font-weight:700}
.chip.A{color:var(--a)} .chip.B{color:var(--b)} .chip.C{color:var(--c)}
.kind{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;padding:1px 8px;border-radius:999px;background:var(--gold-soft);color:var(--fg);font-weight:700}
.kind.Decision{background:var(--wait);color:var(--surface)}
.story{margin:0;font-size:.93rem}
.note{margin:0;padding:7px 10px;background:var(--gold-soft);border-radius:4px;font-size:.88rem}
details.more{border-top:1px solid var(--line);padding-top:6px}
details.more summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--muted);letter-spacing:.03em}
details.more[open] summary{margin-bottom:6px}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:6px 0 4px}
ol{margin:0;padding-left:1.5em;display:flex;flex-direction:column;gap:5px;font-size:.9rem}
ol li::marker{color:var(--gold);font-weight:700}
.meta{font-size:.82rem;color:var(--muted);margin:4px 0 0;overflow-wrap:anywhere}
article.small{padding:9px 12px;gap:3px}
article.small h3{font-size:.93rem;font-weight:400}
.err{color:var(--wait);text-align:center}

/* Phone and narrow windows: one column per screen, swipe sideways */
@media (max-width:900px){
  .board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;overscroll-behavior-x:contain;
    scroll-padding-inline:max(16px,env(safe-area-inset-left,0px))}
  .column{flex:0 0 min(88vw,30rem);scroll-snap-align:start}
}
@media (prefers-reduced-motion:no-preference){.board{scroll-behavior:smooth}}
</style>

<header>
  <h1>Between Us Backlog</h1>
  <div class="rule" aria-hidden="true"></div>
  <p class="sub" id="updated">Ask the Keeper to move anything.</p>
  <nav id="nav" aria-label="Columns"></nav>
</header>
<main class="board" id="board"><p class="empty">Loading the backlog…</p></main>

<script>
// Columns in the order work flows; Parked sits at the end, outside the flow.
const COLUMNS = [
  {key:'Waiting on the owner', label:'Waiting on you', id:'waiting', color:'--wait', hint:'Needs your answer or your look.'},
  {key:'Next',         label:'Next',          id:'next',    color:'--next', hint:'Agreed, not started.'},
  {key:'Building now', label:'Building now',  id:'now',     color:'--now',  hint:'One at a time.'},
  {key:'Done',         label:'Done',          id:'done',    color:'--done', hint:'Landed in the last 14 days.'},
  {key:'Parked',       label:'Parked',        id:'parked',  color:'--park', hint:'Not now, not forgotten.'},
];
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>');

function parse(md){
  const out = {}; let sec = null, item = null, field = null;
  for (const raw of md.split('\n')){
    const line = raw.replace(/\s+$/,''); let m;
    if ((m = line.match(/^## (.+)/))){
      const name = m[1].trim().toLowerCase();
      sec = COLUMNS.find(c => name.startsWith(c.key.toLowerCase())) || null;
      if (sec) out[sec.id] = out[sec.id] || []; item = null; continue;
    }
    if (!sec){ if ((m = line.match(/^_Updated (.+)_$/))) out.updated = m[1]; continue; }
    if ((m = line.match(/^### (.+)/))){
      item = {title:m[1].trim(), kind:'', story:'', criteria:[], touches:'', source:'', note:'', extra:[]};
      out[sec.id].push(item); field = null; continue;
    }
    if (!item) continue;
    if ((m = line.match(/^\*\*(Story|Task|Decision):\*\*\s*(.*)/))){ item.kind = m[1]; item.story = m[2]; field='story'; continue; }
    if (/^\*\*Acceptance criteria:\*\*/.test(line)){ field='criteria'; continue; }
    if ((m = line.match(/^\*\*Touches:\*\*\s*(.*)/))){ item.touches = m[1]; field=null; continue; }
    if ((m = line.match(/^\*\*Source:\*\*\s*(.*)/))){ item.source = m[1]; field=null; continue; }
    if ((m = line.match(/^\*\*Status note:\*\*\s*(.*)/))){ item.note = m[1]; field='note'; continue; }
    if ((m = line.match(/^\s*\d+\.\s+(.*)/)) && field==='criteria'){ item.criteria.push(m[1]); continue; }
    if (line.trim()==='') continue;
    if (field==='criteria' && item.criteria.length && /^\s+/.test(raw)){ item.criteria[item.criteria.length-1] += '\n' + line.trim(); continue; }
    if (field==='story'){ item.story += ' ' + line.trim(); continue; }
    if (field==='note'){ item.note += ' ' + line.trim(); continue; }
    item.extra.push(line.trim());
  }
  return out;
}

function chips(title){
  const m = title.match(/\((?:Area\s*)?([ABC](?:\s*[\/+,&]\s*[ABC])*)[^)]*\)\s*$/);
  let clean = m ? title.slice(0, m.index).trim() : title;
  clean = clean.replace(/^(Decision|Task|Story):\s*/i, '');
  const names = {A:'A · Deck', B:'B · Looks', C:'C · App'};
  const areas = m ? [...new Set(m[1].match(/[ABC]/g))] : [];
  return {clean, html: areas.map(a => `<span class="chip ${a}">${names[a]}</span>`).join('')};
}

function card(s){
  const c = chips(s.title);
  const crit = s.criteria.length
    ? `<p class="label">${s.kind==='Decision' ? 'Options' : 'Done when'}</p><ol>${s.criteria.map(x=>`<li>${x.split('\n').map(inline).join('<br>')}</li>`).join('')}</ol>` : '';
  const meta = [...s.extra.map(x=>`<p class="meta">${inline(x)}</p>`),
    s.touches ? `<p class="meta">Touches: ${inline(s.touches)}</p>` : '',
    s.source ? `<p class="meta">From: ${inline(s.source)}</p>` : ''].join('');
  const moreLabel = s.criteria.length ? `${s.kind==='Decision' ? 'Options' : 'Done when'} (${s.criteria.length})` : 'Details';
  return `<article>
    ${(c.html || s.kind) ? `<div class="chips">${s.kind ? `<span class="kind ${s.kind}">${s.kind}</span>` : ''}${c.html}</div>` : ''}
    <h3>${inline(c.clean)}</h3>
    ${s.story ? `<p class="story">${inline(s.story)}</p>` : ''}
    ${s.note ? `<p class="note">${inline(s.note)}</p>` : ''}
    ${(crit || meta) ? `<details class="more"><summary>${moreLabel}</summary>${crit}${meta}</details>` : ''}
  </article>`;
}

function smallCard(s){
  const c = chips(s.title);
  return `<article class="small"><h3>${inline(c.clean)}</h3>${s.source ? `<p class="meta">${inline(s.source)}</p>` : ''}</article>`;
}

function render(data){
  const board = document.getElementById('board'), nav = document.getElementById('nav');
  if (data.updated) document.getElementById('updated').textContent = 'Updated ' + data.updated + '. Ask the Keeper to move anything.';
  nav.innerHTML = COLUMNS.map(c => `<button type="button" data-id="${c.id}" style="--k:var(${c.color})"><span class="dot" aria-hidden="true"></span>${c.label}<b>${(data[c.id]||[]).length}</b></button>`).join('');
  board.innerHTML = COLUMNS.map(c => {
    const items = data[c.id] || [];
    const body = items.length ? items.map(c.id==='done' ? smallCard : card).join('') : '<p class="empty">Nothing here.</p>';
    return `<section class="column ${c.id}" id="${c.id}" style="--k:var(${c.color})" aria-label="${c.label}">
      <h2>${c.label}<span class="count">${items.length}</span></h2><p class="hint">${c.hint}</p>${body}</section>`;
  }).join('');

  const cols = [...board.querySelectorAll('.column')], btns = [...nav.querySelectorAll('button')];
  const mark = id => btns.forEach(b => b.setAttribute('aria-current', String(b.dataset.id === id)));
  nav.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const col = document.getElementById(b.dataset.id);
    col.scrollIntoView({inline:'start', block:'start'});
    mark(b.dataset.id);
  });
  // On a phone, light up the column that is on screen.
  if ('IntersectionObserver' in window){
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && board.scrollWidth > board.clientWidth + 4) mark(e.target.id); }), {root:board, threshold:.6});
    cols.forEach(c => io.observe(c));
  }
  const h = location.hash.slice(1); if (h && document.getElementById(h)) nav.querySelector(`[data-id="${h}"]`)?.click();
}

fetch('backlog.md', {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => render(parse(md)))
  .catch(() => { document.getElementById('board').innerHTML = '<p class="err">The backlog file could not be loaded. Ask the Keeper to republish the page.</p>'; });
</script>
